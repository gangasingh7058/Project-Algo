services:
  compiler:
    container_name: codearcade-compiler
    image: gtinna005/codearcade-compiler:latest
    ports:
      - "3002:3002"
    env_file:
      - ./Compiler/.env
    depends_on:
      - kafka
    networks:
      - app-network

  backend:
    container_name: codearcade-backend
    image: gtinna005/codearcade-backend:latest
    ports:
      - "3001:3001"
    env_file:
      - ./Backend/.env
    depends_on:
      - compiler
      - redis
      - kafka
    networks:
      - app-network

  mcp:
    container_name: codearcade-mcp
    image: gtinna005/codearcade-mcp:latest
    build: ./MCP_Server
    ports:
      - "3003:3003"
    env_file:
      - ./MCP_Server/.env
    depends_on:
      - compiler
    networks:
      - app-network

  redis:
    container_name: codearcade-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  kafka:
    container_name: codearcade-kafka
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
